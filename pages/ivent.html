<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/ivent.css">
  <link rel="stylesheet" href="../styles/general.css">
  <title>Событие</title>
</head>
<body>
  <header>
    <div class="log">
      <img src="../sorces/logo.png" id="logoimg">
      <a href="../pages/main.html" class="return">Главная</a>
    </div>
    <span type="submit"  id="in">Вход</span>
    <div id="userMenu" style="display: none">
      <button id="profileButton">Профиль</button>
      <button id="logoutButton">Выход</button>
  </div>
  </header>
  <main>
    <div class="ivent-block">
      <div class="field" >
          <img src="../sorces/not_work_old.jpg" alt="" class="img" id="image">
      </div>
      <div class="field" >
          <label for="description">Описание акции:</label> 
          <input type="text" id="description" placeholder="Давай, давай, заходи!"> 
      </div>
      <div class="field">
          <label for="type">Тип выдаваемой скидки</label> 
          <select id="type"> 
            <option value="PERCENT">PERCENT</option> 
            <option value="FIXED_AMOUNT">FIXED_AMOUNT</option> 
          </select> 
      </div> 
      <div class="field" >
          <label for="value">Размер скидки</label> 
          <input type="text" id="value" placeholder="10"> 
      </div>
      <div class="field" >
          <label for="platformFor">Тип </label> 
          <select id="platformFor"> 
            <option value="PC">PC</option> 
            <option value="VR">VR </option> 
          </select> 
      </div>
      <div class="field" >
          <label for="start_date">Дата начала акции</label> 
          <input type="date" id="start_date" placeholder="2025-06-28T15:10:45.096Z"> 
      </div>
      <div class="field" >
          <label for="end_date">Дата канца акции</label> 
          <input type="date" id="end_date" placeholder="2025-06-28T15:10:45.096Z"> 
      </div>
      <div class="field" >
          <label for="image">Изображение</label> 
          <input type="file" id="image"> 
      </div>
      <button type="submit" id="save">Сохранить</button> 
    </div>
  </main>
  <footer>
    <div class="foot-text">© 2025 - ATGC</div>
  </footer>
  <script src="../scripts/ivent.js"></script>
</body>
</html>
